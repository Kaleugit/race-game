<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Race Game</title>
    <link rel="icon" href="data:,">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: #050208;
      }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #hud {
        position: fixed; top: 12px; left: 12px;
        font-family: 'Courier New', monospace;
        color: #fffbe0; text-shadow: 2px 2px 0 #000;
        font-size: 14px; line-height: 1.4;
        pointer-events: none;
      }
      #hud .v { color: #ffd86b; }
      #hud .vbot { color: #ff8a3a; }
      #help {
        position: fixed; bottom: 12px; left: 12px;
        font-family: 'Courier New', monospace;
        color: #cfd6ff; text-shadow: 2px 2px 0 #000;
        font-size: 12px; opacity: 0.85;
      }
      #crashfade {
        position: fixed; inset: 0;
        background: #050208;
        opacity: 0;
        pointer-events: none;
      }
      #crashprompt {
        position: fixed; left: 50%; bottom: 64px;
        transform: translateX(-50%);
        display: none;
        font-family: 'Courier New', monospace;
        color: #fffbe0; text-shadow: 2px 2px 0 #000;
        font-size: 14px; letter-spacing: 2px;
        pointer-events: none;
      }
      #crashprompt.show { display: block; }
      #crashtitle {
        position: fixed; left: 50%; bottom: 110px;
        transform: translateX(-50%);
        display: none;
        font-family: 'Courier New', monospace;
        color: #fffbe0; text-shadow: 2px 2px 0 #000;
        font-size: 32px; letter-spacing: 6px;
        white-space: nowrap;
        pointer-events: none;
      }
      #crashtitle.show { display: block; }
      #mobiletoggle {
        position: fixed; top: 12px; right: 12px;
        font-family: 'Courier New', monospace;
        background: rgba(0,0,0,0.4); color: #fffbe0;
        border: 1px solid rgba(255,255,255,0.3);
        padding: 8px 12px; font-size: 13px;
        cursor: pointer; user-select: none;
        text-shadow: 2px 2px 0 #000;
      }
      #touchpad {
        position: fixed; inset: 0;
        pointer-events: none;
        display: none;
      }
      #touchpad.show { display: block; }
      #touchpad .pad { position: absolute; bottom: 12px; display: flex; gap: 8px; pointer-events: none; }
      #touchpad .pad-left { left: 12px; }
      #touchpad .pad-right { right: 12px; align-items: flex-end; }
      #touchpad .tbtn {
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.35);
        color: rgba(255,251,224,0.6);
        font-family: 'Courier New', monospace;
        line-height: 1;
        display: flex; align-items: center; justify-content: center;
        user-select: none; -webkit-user-select: none; touch-action: none;
        pointer-events: auto;
      }
      #touchpad .tbtn:active { background: rgba(255,255,255,0.28); color: rgba(255,251,224,0.95); }
      #touchpad .tbtn-arrow {
        width: 88px; height: 88px;
        border-radius: 50%;
        font-size: 44px;
      }
      #touchpad .tbtn-pedal {
        width: 38px; height: 62px;
        border-radius: 18px;
        font-size: 20px;
        letter-spacing: -1px;
      }
      #touchpad .tbtn-pedal.brake { color: rgba(255,160,140,0.7); border-color: rgba(255,160,140,0.5); }
      #touchpad .tbtn-pedal.brake:active { color: rgba(255,180,160,1); }
      #touchpad .tbtn-gasturbo {
        width: 42px; height: 110px;
        border-radius: 22px;
        font-size: 18px;
        letter-spacing: -1px;
        flex-direction: column;
        padding: 4px 0;
        color: rgba(180,255,180,0.7);
        border-color: rgba(180,255,180,0.5);
        background: linear-gradient(to top, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.10) 50%, rgba(255,200,80,0.10) 50%, rgba(255,200,80,0.18) 100%);
      }
      #touchpad .tbtn-gasturbo .zone-turbo {
        flex: 1; display: flex; align-items: center; justify-content: center;
        font-size: 9px; color: rgba(255,200,80,0.75); letter-spacing: 0;
      }
      #touchpad .tbtn-gasturbo .zone-gas {
        flex: 1; display: flex; align-items: center; justify-content: center;
        font-size: 18px;
      }
      #touchpad .tbtn-gasturbo.gas-on { color: rgba(200,255,200,1); border-color: rgba(200,255,200,0.85); }
      #touchpad .tbtn-gasturbo.turbo-on .zone-turbo { color: rgba(255,220,120,1); }
      #touchpad .tbtn-gasturbo.turbo-on { background: linear-gradient(to top, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.18) 50%, rgba(255,200,80,0.30) 50%, rgba(255,200,80,0.45) 100%); }
      #lobby {
        position: fixed; inset: 0; z-index: 100;
        background: url('/Lobby-1.png') center center / cover no-repeat, linear-gradient(135deg, #1a0a2e 0%, #2d1a4a 50%, #1a0a2e 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      #lobby-canvas {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        image-rendering: pixelated; image-rendering: crisp-edges;
        pointer-events: none;
      }
      #lobby-ui {
        position: absolute; top: 10vh; left: 0; right: 0; z-index: 1;
        display: flex; flex-direction: column;
        align-items: center; gap: 24px;
      }
      #lobby-title {
        font-family: 'Courier New', monospace;
        font-size: 42px; letter-spacing: 8px;
        color: #ffd86b; text-shadow: 3px 3px 0 #000, 0 0 24px #ff7a4a;
        user-select: none;
      }
      #lobby-play {
        font-family: 'Courier New', monospace;
        font-size: 22px; letter-spacing: 6px;
        color: #fffbe0; background: rgba(0,0,0,0.55);
        border: 2px solid #ffd86b;
        padding: 14px 52px; cursor: pointer;
        text-shadow: 2px 2px 0 #000;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      #lobby-play:hover {
        background: rgba(255,216,107,0.18);
        border-color: #ff8a3a; color: #ffd86b;
      }
      #lobby-car-selector {
        display: flex; align-items: center; gap: 18px;
      }
      #lobby-car-selector .cs-arrow {
        font-family: 'Courier New', monospace;
        font-size: 22px; color: #fffbe0;
        background: rgba(0,0,0,0.55);
        border: 2px solid #ffd86b;
        padding: 8px 18px; cursor: pointer;
        text-shadow: 2px 2px 0 #000;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        line-height: 1;
      }
      #lobby-car-selector .cs-arrow:hover {
        background: rgba(255,216,107,0.18);
        border-color: #ff8a3a; color: #ffd86b;
      }
      #lobby-car-name {
        font-family: 'Courier New', monospace;
        font-size: 18px; letter-spacing: 4px;
        color: #ffd86b; text-shadow: 2px 2px 0 #000;
        min-width: 180px; text-align: center;
        user-select: none;
      }
      #countdown-overlay {
        position: fixed; inset: 0; z-index: 50;
        background: rgba(5,2,8,0.72);
        display: none;
        flex-direction: column;
        align-items: center; justify-content: center;
        gap: 28px;
        pointer-events: none;
      }
      #countdown-overlay.show { display: flex; }
      #countdown-vs {
        font-family: 'Courier New', monospace;
        font-size: 22px; letter-spacing: 6px;
        color: #cfd6ff; text-shadow: 2px 2px 0 #000;
      }
      #countdown-num {
        font-family: 'Courier New', monospace;
        font-size: 96px; letter-spacing: 4px;
        color: #ffd86b; text-shadow: 4px 4px 0 #000, 0 0 40px #ff7a4a;
        line-height: 1;
        min-width: 160px; text-align: center;
      }
      #end-overlay {
        position: fixed; inset: 0; z-index: 60;
        background: rgba(5,2,8,0.88);
        display: none;
        flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
      }
      #end-overlay.show { display: flex; }
      #end-result {
        font-family: 'Courier New', monospace;
        font-size: 64px; letter-spacing: 10px;
        text-shadow: 4px 4px 0 #000;
        line-height: 1;
      }
      #end-result.vitoria { color: #44ff88; text-shadow: 4px 4px 0 #000, 0 0 32px #44ff88; }
      #end-result.derrota { color: #ff4444; text-shadow: 4px 4px 0 #000, 0 0 32px #ff4444; }
      #end-times {
        font-family: 'Courier New', monospace;
        font-size: 20px; letter-spacing: 3px;
        color: #fffbe0; text-shadow: 2px 2px 0 #000;
        line-height: 2;
        text-align: center;
      }
      #end-times .t-label { color: #cfd6ff; }
      #end-times .t-val { color: #ffd86b; }
      #end-times .t-best-new { color: #44ff88; }
      #end-play-again {
        margin-top: 14px;
        font-family: 'Courier New', monospace;
        font-size: 18px; letter-spacing: 5px;
        color: #fffbe0; background: rgba(0,0,0,0.55);
        border: 2px solid #ffd86b;
        padding: 12px 44px; cursor: pointer;
        text-shadow: 2px 2px 0 #000;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      #end-play-again:hover {
        background: rgba(255,216,107,0.18);
        border-color: #ff8a3a; color: #ffd86b;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BHPtHEKR.js"></script>
  </head>
  <body>
    <div id="lobby">
      <canvas id="lobby-canvas"></canvas>
      <div id="lobby-ui">
        <div id="lobby-title">RACE GAME</div>
        <div id="lobby-car-selector">
          <button class="cs-arrow" id="lobby-prev">&#9668;</button>
          <span id="lobby-car-name">BANDEIRANTE</span>
          <button class="cs-arrow" id="lobby-next">&#9658;</button>
        </div>
        <button id="lobby-play">JOGAR</button>
      </div>
    </div>
    <div id="countdown-overlay">
      <div id="countdown-vs">vs. BOT</div>
      <div id="countdown-num">3</div>
    </div>
    <div id="end-overlay">
      <div id="end-result">VITÓRIA</div>
      <div id="end-times">
        <span class="t-label">VOCÊ</span> <span class="t-val" id="end-player-time">0.0s</span><br/>
        <span class="t-label">BOT&nbsp;</span> <span class="t-val">52.0s</span><br/>
        <span class="t-label">MELHOR</span> <span class="t-val" id="end-best-time">—</span>
      </div>
      <button id="end-play-again">JOGAR DE NOVO</button>
    </div>
    <div id="hud">
      VEL <span class="v" id="speed">0</span> km/h<br />
      DIST <span class="v" id="dist">0</span> m<br />
      TURBO <span class="v" id="turbobar">[████████████]</span><br />
      BOT <span class="vbot" id="bot-dist">0</span> m<br />
      <span id="hud-debug" style="display:none">SUSP <span class="v" id="suspstate">ON</span><br />TURBO INF <span class="v" id="infturbo">OFF</span><br /></span>
      <span id="hud-pos" style="display:none">POS <span class="v" id="pos">0</span></span>
    </div>
    <div id="help">
      &uarr; acelera &nbsp; &darr; freia &nbsp; &larr;&rarr; inclina &nbsp; ESPA&Ccedil;O turbo &nbsp; R reinicia &nbsp; S susp &nbsp; T turbo inf
    </div>
    <div id="crashfade"></div>
    <div id="crashtitle">BATEU!</div>
    <div id="crashprompt">pressione R para reiniciar ou aguarde 2s</div>
    <button id="mobiletoggle">TOUCH</button>
    <div id="touchpad">
      <div class="pad pad-left">
        <button class="tbtn tbtn-arrow" data-key="left">&larr;</button>
        <button class="tbtn tbtn-arrow" data-key="right">&rarr;</button>
      </div>
      <div class="pad pad-right">
        <button class="tbtn tbtn-pedal brake" data-key="down">&#9776;</button>
        <button class="tbtn tbtn-gasturbo" id="gasturbo">
          <span class="zone-turbo">TURBO</span>
          <span class="zone-gas">&#8285;&#8285;&#8285;</span>
        </button>
      </div>
    </div>
  </body>
</html>
