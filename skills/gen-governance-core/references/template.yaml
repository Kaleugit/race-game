# Canonical templates for the .governance/ runtime artifacts.
#
# SCOPE SPLIT:
#   - .governance/{CORE,MINI,SUBAGENT}.md are the runtime payload injected
#     by Claude Code hooks. They are PROSE — imperative one-liners grouped
#     by visual priority. They contain NO YAML metadata.
#   - .governance/meta.yaml is the audit sidecar. It stays plain YAML and
#     is NEVER injected at runtime.
#
# Why prose for the payload: the agent does not need rule IDs, source
# anchors, priority/trigger fields, or category labels at runtime. Those
# served the regenerator. Stripping them roughly halves L2 injection size
# while keeping every behavioral rule intact.

# --- .governance/CORE.md template (L2: full reference) ---
#
# <!-- AUTO-GENERATED by gen-governance-core. Run /gen-governance-core to refresh. Metadata in .governance/meta.yaml. -->
#
# INTEGRITY (NEVER violate):
# - <one imperative sentence per non-negotiable>
# - ...
#
# BLOCKING — before task start:
# - <one imperative sentence>
# - ...
#
# BLOCKING — before declaring done:
# - <one imperative sentence>
# - ...
#
# BLOCKING — always:
# - <one imperative sentence>
# - ...
#
# BLOCKING — on compaction:
# - <one imperative sentence>
# - ...
#
# HIGH — before task start:
# - <one imperative sentence>
# - ...
#
# HIGH — before declaring done:
# - <one imperative sentence>
# - ...
#
# HIGH — always:
# - <one imperative sentence>
# - ...
#
# DECISION CRITERIA (CDT — apply when criteria from PROJECT_SPECS.md §10 are silent):
# - <criterion name> — <imperative direction>.
# - ...

# --- .governance/MINI.md template (L1: every-turn attention amplifier) ---
#
# <!-- AUTO-GENERATED by gen-governance-core. Run /gen-governance-core to refresh. Metadata in .governance/meta.yaml. -->
#
# INTEGRITY (NEVER violate):
# - <every non-negotiable>
#
# BLOCKING — before declaring done:
# - <blocking before_declaring_done rules only>
#
# BLOCKING — always:
# - <blocking always rules only>
#
# Keep MINI.md under ~1500 bytes. Drop HIGH and CDT sections; they live in CORE.md.

# --- .governance/SUBAGENT.md template (L3: subagent-tuned subset) ---
#
# Same structure as CORE.md but DROP the "before task start" and
# "on compaction" sections. Subagents do not select tasks and are not
# subject to context compaction.
#
# Keep: INTEGRITY, BLOCKING — before declaring done, BLOCKING — always,
# HIGH — before declaring done, HIGH — always, DECISION CRITERIA.

# --- .governance/meta.yaml template (audit sidecar, NOT injected) ---
#
# generated_at: <ISO 8601 UTC>
# generator: gen-governance-core
# sources:
#   - path: AGENTS.md
#     sha256: <hex>
#   - path: INTEGRITY-RULES.md
#     sha256: <hex>
#   - path: CLAUDE.md
#     sha256: <hex>
#   - path: docs/PROJECT_SPECS.md
#     sha256: <hex>
#   - path: docs/decisions.md
#     sha256: <hex>
#   - path: docs/language-policy.md
#     sha256: <hex>
# sources_missing:
#   - <optional path>
#
# Rule traceability (id/source/priority/trigger/category) is recoverable
# from this sidecar plus the source documents. The runtime payload does
# not need to carry it.
